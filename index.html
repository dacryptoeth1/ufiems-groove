<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UFIEM’S GROOVE — Coming Soon</title>
  <meta name="description" content="Something extraordinary is taking shape.">
  <meta name="theme-color" content="#040208">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UFIEM’S GROOVE">
  <meta property="og:description" content="Something extraordinary is taking shape.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preload" href="assets/rose-poster.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The name's display face, subset to just the letters it uses (a few KB). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap&text=UFIEM%E2%80%99S%20GROV">
  <!-- Bodoni Moda: "Coming Soon". Jost (thin): tagline, launch teaser, links. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Jost:wght@200;300&display=swap">
  <link rel="stylesheet" href="styles.css">

  <!-- Enables the intro sequence. Without JS, everything renders in its final state. -->
  <script>document.documentElement.classList.add('js');</script>
  <script src="main.js" defer></script>
</head>
<body>
  <!-- Petal artwork, drawn once and reused by every falling petal (see main.js → petals). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="pg-body-a" cx="50%" cy="30%" r="80%">
        <stop offset="0" stop-color="#5a2290"/>
        <stop offset=".45" stop-color="#2f0d52"/>
        <stop offset=".8" stop-color="#150525"/>
        <stop offset="1" stop-color="#07020c"/>
      </radialGradient>
      <radialGradient id="pg-body-b" cx="45%" cy="28%" r="82%">
        <stop offset="0" stop-color="#3a1460"/>
        <stop offset=".5" stop-color="#1a0630"/>
        <stop offset="1" stop-color="#040107"/>
      </radialGradient>
      <linearGradient id="pg-base" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".55" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".75"/>
      </linearGradient>
      <linearGradient id="pg-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d9c2ff" stop-opacity=".38"/>
        <stop offset=".4" stop-color="#b28cff" stop-opacity=".08"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <!-- Cupped petal: ruffled rounded top, narrowing to the base. -->
      <path id="pg-shape" d="M50 138C38 131 14 108 7 78 1 52 8 24 26 11c6-4 11-5 16-3 4 1 6 4 9 2 4-4 9-7 17-5 17 4 29 22 31 45 2 26-8 52-26 74-7 8-15 12-20 14z"/>
      <symbol id="petal-a" viewBox="0 0 100 140">
        <use href="#pg-shape" fill="url(#pg-body-a)"/>
        <path d="M50 136C47 104 45 66 49 22M50 120C38 96 26 70 22 40M51 118C62 94 74 68 79 40" fill="none" stroke="#c9a6ff" stroke-opacity=".14" stroke-width=".9" stroke-linecap="round"/>
        <path d="M24 24C34 46 38 80 40 112" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
        <use href="#pg-shape" fill="url(#pg-sheen)"/>
        <use href="#pg-shape" fill="url(#pg-base)"/>
        <use href="#pg-shape" fill="none" stroke="#c7a2ff" stroke-opacity=".32" stroke-width="1.1"/>
      </symbol>
      <symbol id="petal-b" viewBox="0 0 100 140">
        <use href="#pg-shape" fill="url(#pg-body-b)"/>
        <path d="M50 136C48 104 47 66 50 22M50 118C40 96 30 70 26 42M51 116C61 94 71 68 76 42" fill="none" stroke="#b58cff" stroke-opacity=".12" stroke-width=".9" stroke-linecap="round"/>
        <path d="M72 22C64 48 60 82 58 114" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="8" stroke-linecap="round"/>
        <use href="#pg-shape" fill="url(#pg-sheen)" opacity=".7"/>
        <use href="#pg-shape" fill="url(#pg-base)"/>
        <use href="#pg-shape" fill="none" stroke="#a77cf0" stroke-opacity=".28" stroke-width="1.1"/>
      </symbol>
    </defs>
  </svg>

  <main class="stage">

    <!-- Atmosphere (decorative) -->
    <div class="env" aria-hidden="true">
      <div class="env__base"></div>
      <div class="env__ambient env__ambient--a"></div>
      <div class="env__ambient env__ambient--b"></div>
      <div class="env__floor"></div>
      <canvas class="fx" id="fx"></canvas>
      <div class="env__vignette"></div>
      <div class="env__grain"></div>
    </div>

    <section class="hero">
      <!-- The bloom. Nothing in here may create a stacking context on .bloom itself: the video uses
           mix-blend-mode: screen to melt its black background into the page. -->
      <div class="bloom" id="bloom">
        <div class="bloom__pulse" aria-hidden="true"></div>

        <!-- The name sits *under* the screen-blended flower, so while it is small and blurred it
             reads as light glowing inside the bud; main.js grows it in step with the video. -->
        <h1 class="name" id="name">
          <span class="name__inner">
            <img class="name__emblem" src="assets/emblem.webp" alt="" width="256" height="238" decoding="async">
            <span class="name__text">UFIEM’S GROOVE</span>
          </span>
        </h1>

        <div class="bloom__media" aria-hidden="true">
          <video class="bloom__video" id="bloom-video" src="assets/rose-bloom.mp4" poster="assets/rose-poster.webp"
                 muted playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
          <!-- Last frame, shown instead of the video for reduced motion or when it can't play. -->
          <img class="bloom__still" src="assets/rose-end.webp" alt="" width="960" height="960" decoding="async">
        </div>
      </div>

      <!-- Falling petals (filled by main.js after the bloom). -->
      <div class="petals" id="petals" aria-hidden="true"></div>

      <div class="copy">
        <p class="headline">
          <span class="sr-only">Coming Soon</span>
          <span class="headline__letters" aria-hidden="true"><span class="headline__word"><span style="--i:0">C</span><span style="--i:1">O</span><span style="--i:2">M</span><span style="--i:3">I</span><span style="--i:4">N</span><span style="--i:5">G</span></span><span class="headline__space"> </span><span class="headline__word"><span style="--i:6">S</span><span style="--i:7">O</span><span style="--i:8">O</span><span style="--i:9">N</span></span></span>
        </p>

        <p class="tagline">Something extraordinary is taking shape.</p>

        <p class="announce">
          <span class="announce__line" aria-hidden="true"></span>
          <span class="announce__text">Launch date<span class="announce__gem" aria-hidden="true"></span>to be announced<span class="announce__dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
          <span class="announce__line" aria-hidden="true"></span>
        </p>
      </div>
    </section>

    <ul class="social" aria-label="Contact">
      <li style="--k:0">
        <a href="https://x.com/0xrhydar" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span><span class="sr-only">X: </span>@0xrhydar</span>
        </a>
      </li>
      <li class="social__sep" aria-hidden="true" style="--k:1"></li>
      <li style="--k:2">
        <a href="mailto:dacryptoethss@gmail.com">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M3.5 5.75h17v12.5h-17zM3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
          <span><span class="sr-only">Email: </span>dacryptoethss@gmail.com</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
